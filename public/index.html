<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡️ Video Call 256K - ไอคิว</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="join-screen">
        <h1>📞 ห้องส่วนตัว</h1>
        <p>สำหรับคุยกับเพื่อนแค่ 2 คน</p>
        <input type="text" id="room-id-input" placeholder="ใส่รหัสห้อง (เช่น: 'IQ_BESTIE')">
        <button id="join-button">เข้าร่วมห้อง</button>
        <p class="warning-text">⚠️ **สำคัญ:** เน็ต 256 kbps แนะนำให้ปิดกล้อง เพื่อให้เสียงชัดเจน</p>
    </div>

    <div id="call-screen" style="display: none;">
        <h2 id="room-info"></h2>
        <div id="video-grid">
            </div>

        <div class="controls">
            <button id="toggle-video">🎥 เปิด/ปิดกล้อง</button>
            <button id="toggle-audio">🎤 เปิด/ปิดไมค์</button>
            <button id="flip-camera">🔄 กลับกล้อง</button> <button id="share-screen">🖥️ แชร์หน้าจอ</button>
            <button id="leave-button" class="leave-btn">❌ ออกจากห้อง</button>
        </div>
        <div id="status-message">สถานะ: รอเพื่อนเข้าร่วม...</div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
